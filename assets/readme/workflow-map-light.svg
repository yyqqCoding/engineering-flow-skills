<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Choose a workflow by your goal</title>
  <desc id="desc">Choose a workflow by the outcome you need. Develop aligns acceptance, waits for approval, then implements and verifies each behavior. Diagnose completes repairs when requested. Code Design returns a reusable proposal. Review is read-only until specific repairs are requested. Handoff preserves task state and existing authority. The workflows are independent entry points.</desc>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="10" fill="#fbfcfb" stroke="#dce2de"/>
  <text x="48" y="44" fill="#087b32" font-size="12" font-weight="700" letter-spacing="0.11em">CHOOSE BY YOUR GOAL</text>
  <text x="48" y="74" fill="#101512" font-size="19" font-weight="650">Five entry points. Choose the outcome you need.</text>
  <g id="workflow-develop">
  <rect x="48" y="100" width="208" height="262" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="152" cy="144" r="27" fill="#e9f7ee" stroke="#087b32" stroke-width="1.6"/>
  <g transform="translate(136 128)" fill="none" stroke="#087b32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16h6M23.5 16h6"/><circle cx="16" cy="16" r="7"/><path d="m12.8 16.2 2.2 2.2 4.2-4.8"/></g>
  <text x="152" y="194" fill="#087b32" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">BUILD A CHANGE</text>
  <text x="152" y="220" fill="#101512" font-size="20" font-weight="700" text-anchor="middle">Develop</text>
  <text x="152" y="250" fill="#58635d" font-size="13" text-anchor="middle">Align acceptance examples</text>
  <text x="152" y="271" fill="#58635d" font-size="13" text-anchor="middle">Build + verify each slice</text>
  <text x="152" y="292" fill="#58635d" font-size="13" text-anchor="middle">Own design, fixes and review</text>
  <rect x="66" y="315" width="172" height="26" rx="13" fill="#e9f7ee"/>
  <text x="152" y="332" fill="#087b32" font-size="11.5" font-weight="600" text-anchor="middle">Approve before coding</text>
  </g>
  <g id="workflow-diagnose">
  <rect x="272" y="100" width="208" height="262" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="376" cy="144" r="27" fill="#fff3e8" stroke="#df6c13" stroke-width="1.6"/>
  <g transform="translate(360 128)" fill="none" stroke="#df6c13" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 22h4.2l2.6-8.5 3.4 13 2.6-6H21"/><circle cx="23" cy="10.5" r="5.5"/><path d="m27 14.5 3 3.2"/></g>
  <text x="376" y="194" fill="#df6c13" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">FIX BROKEN BEHAVIOR</text>
  <text x="376" y="220" fill="#101512" font-size="20" font-weight="700" text-anchor="middle">Diagnose</text>
  <text x="376" y="250" fill="#58635d" font-size="13" text-anchor="middle">Reproduce the symptom</text>
  <text x="376" y="271" fill="#58635d" font-size="13" text-anchor="middle">Find and fix the cause</text>
  <text x="376" y="292" fill="#58635d" font-size="13" text-anchor="middle">Verify the regression</text>
  <rect x="290" y="315" width="172" height="26" rx="13" fill="#fff3e8"/>
  <text x="376" y="332" fill="#df6c13" font-size="11.5" font-weight="600" text-anchor="middle">Fix when requested</text>
  </g>
  <g id="workflow-code-design">
  <rect x="496" y="100" width="208" height="262" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="600" cy="144" r="27" fill="#f2edfc" stroke="#7142c7" stroke-width="1.6"/>
  <g transform="translate(584 128)" fill="none" stroke="#7142c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15.2c6.5 0 8.5-8 15-8M8 16.8c6.5 0 8.5 8 15 8" stroke-dasharray="3 3" opacity="0.5"/><path d="M8 16h15"/><circle cx="4.5" cy="16" r="2.6"/><circle cx="25.8" cy="16" r="3.2"/></g>
  <text x="600" y="194" fill="#7142c7" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">SETTLE THE DESIGN</text>
  <text x="600" y="220" fill="#101512" font-size="20" font-weight="700" text-anchor="middle">Code Design</text>
  <text x="600" y="250" fill="#58635d" font-size="13" text-anchor="middle">Compare viable choices</text>
  <text x="600" y="271" fill="#58635d" font-size="13" text-anchor="middle">Refine an existing plan</text>
  <text x="600" y="292" fill="#58635d" font-size="13" text-anchor="middle">Reuse settled decisions</text>
  <rect x="514" y="315" width="172" height="26" rx="13" fill="#f2edfc"/>
  <text x="600" y="332" fill="#7142c7" font-size="11.5" font-weight="600" text-anchor="middle">Proposal only</text>
  </g>
  <g id="workflow-review">
  <rect x="720" y="100" width="208" height="262" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="824" cy="144" r="27" fill="#edf4ff" stroke="#2467ce" stroke-width="1.6"/>
  <g transform="translate(808 128)" fill="none" stroke="#2467ce" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.6h11l7 7v18H7zM18 3.6v7.4h7M11.5 17.5h9M11.5 22.5h6"/><path d="M11.5 13.5h9" stroke-width="2.8"/></g>
  <text x="824" y="194" fill="#2467ce" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">ASSESS A CHANGE</text>
  <text x="824" y="220" fill="#101512" font-size="20" font-weight="700" text-anchor="middle">Review</text>
  <text x="824" y="250" fill="#58635d" font-size="13" text-anchor="middle">Check the actual diff</text>
  <text x="824" y="271" fill="#58635d" font-size="13" text-anchor="middle">Report supported findings</text>
  <text x="824" y="292" fill="#58635d" font-size="13" text-anchor="middle">Repair on explicit request</text>
  <rect x="738" y="315" width="172" height="26" rx="13" fill="#edf4ff"/>
  <text x="824" y="332" fill="#2467ce" font-size="11.5" font-weight="600" text-anchor="middle">Read-only by default</text>
  </g>
  <g id="workflow-handoff">
  <rect x="944" y="100" width="208" height="262" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="1048" cy="144" r="27" fill="#f6f8f6" stroke="#58635d" stroke-width="1.6"/>
  <g transform="translate(1032 128)" fill="none" stroke="#58635d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 16h14" stroke-dasharray="3 3"/><rect x="11" y="12.5" width="7" height="7" rx="2"/><circle cx="4.5" cy="16" r="3"/><circle cx="27.5" cy="16" r="3"/></g>
  <text x="1048" y="194" fill="#58635d" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">CONTINUE ELSEWHERE</text>
  <text x="1048" y="220" fill="#101512" font-size="20" font-weight="700" text-anchor="middle">Handoff</text>
  <text x="1048" y="250" fill="#58635d" font-size="13" text-anchor="middle">Capture the task state</text>
  <text x="1048" y="271" fill="#58635d" font-size="13" text-anchor="middle">Keep decisions and evidence</text>
  <text x="1048" y="292" fill="#58635d" font-size="13" text-anchor="middle">Preserve existing authority</text>
  <rect x="962" y="315" width="172" height="26" rx="13" fill="#f6f8f6"/>
  <text x="1048" y="332" fill="#58635d" font-size="11.5" font-weight="600" text-anchor="middle">No new authorization</text>
  </g>
  <path d="M48 388H1152" stroke="#dce2de"/>
  <text x="48" y="417" fill="#101512" font-size="16" font-weight="650">Develop includes design, debugging and self-review.</text>
  <text x="48" y="440" fill="#58635d" font-size="13">Same-task follow-ups keep context and existing authority. Switch workflows when your goal changes.</text>
</svg>
