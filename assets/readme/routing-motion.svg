<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc">
<title id="title">Minimal Core versus explicit workflow</title>
<desc id="desc">The default path handles a clear request directly. The invoked Develop path aligns requirements, awaits explicit approval, builds and verifies. Animated dotted lines show flow only.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#eaf1fa"/></linearGradient><linearGradient id="line"><stop stop-color="#2baf8a"/><stop offset="1" stop-color="#4e86c9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#15436a" flood-opacity=".11"/></filter></defs>
<style>
.t{font-family:Inter,"Segoe UI",Arial,sans-serif}
.run{stroke-dasharray:8 12;animation:run 5s linear infinite}
.pause{animation:pulse 3s ease-in-out infinite}
@keyframes run{to{stroke-dashoffset:-140}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.run,.pause{animation:none!important}}
</style>
<rect x=".5" y=".5" width="1199" height="331" rx="22" fill="url(#bg)" stroke="#d5e4eb"/>
<text x="36" y="58" class="t" fill="#153950" font-size="28" font-weight="800">Two paths. One clear boundary.</text>
<rect x="35" y="91" width="238" height="84" rx="15" fill="#dcf4ec" stroke="#93ceb8" filter="url(#s)"/>
<text x="57" y="124" class="t" fill="#117f67" font-size="21" font-weight="800">DEFAULT</text>
<text x="57" y="154" class="t" fill="#1b4c43" font-size="22" font-weight="700">Minimal Core</text>
<path d="M282 133H591" stroke="#9dcbb9" stroke-width="5" stroke-linecap="round"/>
<path d="M282 133H591" stroke="#16886e" stroke-width="4" class="run"/>
<path d="m584 125 12 8-12 8" fill="none" stroke="#16886e" stroke-width="3" stroke-linecap="round"/>
<rect x="607" y="91" width="558" height="84" rx="15" fill="#fff" stroke="#c7ded9" filter="url(#s)"/>
<circle cx="649" cy="133" r="18" fill="#e1f5e9" stroke="#62ad8e"/>
<path d="m641 133 6 6 12-14" fill="none" stroke="#188b70" stroke-width="3.5" stroke-linecap="round"/>
<text x="686" y="143" class="t" fill="#205f50" font-size="27" font-weight="760">Direct action</text>
<rect x="35" y="208" width="238" height="88" rx="15" fill="#e3edff" stroke="#a0bdea" filter="url(#s)"/>
<text x="57" y="244" class="t" fill="#3d6cba" font-size="21" font-weight="800">EXPLICIT</text>
<text x="57" y="273" class="t" fill="#264b80" font-size="22" font-weight="700">Develop</text>
<path d="M282 252H1148" stroke="#b2c6d9" stroke-width="5" stroke-linecap="round"/>
<path d="M282 252H1148" stroke="url(#line)" stroke-width="4" class="run"/>
<g class="t" font-weight="760" font-size="22" text-anchor="middle">
<rect x="307" y="213" width="173" height="79" rx="14" fill="#fff" stroke="#c9dbe8"/>
<text x="393" y="262" fill="#224a68">Align</text>
<rect x="492" y="205" width="220" height="95" rx="16" fill="#fff0d8" stroke="#e9ad57" stroke-width="3"/>
<text x="602" y="258" fill="#97580c">Approve</text>
<rect x="725" y="213" width="174" height="79" rx="14" fill="#fff" stroke="#c9dbe8"/>
<text x="812" y="262" fill="#224a68">Build</text>
<rect x="912" y="213" width="224" height="79" rx="14" fill="#dcf4ed" stroke="#94cdb7"/>
<text x="1024" y="262" fill="#176d58">Verify</text>
</g>
<rect x="484" y="197" width="236" height="110" rx="22" fill="none" stroke="#ebb467" stroke-width="3" class="pause"/>
</svg>