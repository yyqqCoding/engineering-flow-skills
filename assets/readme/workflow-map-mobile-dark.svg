      <path d="M11.5 17.5h9" opacity="0.6"/>
      <path d="M11.5 22.5h6" opacity="0.6"/>
      <rect x="9.5" y="13" width="13" height="2" rx="1" fill="#60a5fa" stroke="none"/>
    </g>
    <text x="240" y="556" text-anchor="middle" fill="#edf5ef" font-size="15" font-weight="700">Review</text>
  </g>

  <g>
    <circle cx="240" cy="652" r="38" fill="#17201a" stroke="#405045" stroke-width="2"/>
    <g transform="translate(221 633) scale(1.1875)" fill="none" stroke="#a7b4ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 16h14" stroke-dasharray="3 3"/>
      <rect x="11" y="12.5" width="7" height="7" rx="2" fill="#17201a"/>
      <circle cx="4.5" cy="16" r="3"/>
      <circle cx="27.5" cy="16" r="3"/>
    </g>
    <text x="240" y="718" text-anchor="middle" fill="#edf5ef" font-size="15" font-weight="700">Handoff</text>
  </g>

  <path d="M32 748H448" stroke="#2b372f"/>
  <g>
    <path d="M36 776h26" stroke="#405045" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="780" fill="#a7b4ab" font-size="12">Normal</text>
    <path d="M140 776h26" stroke="#405045" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
    <text x="174" y="780" fill="#a7b4ab" font-size="12">Conditional</text>
    <g transform="translate(276 776)">
      <circle r="10" fill="#fb923c"/>
      <g fill="none" stroke="#0d120f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-2.8-1.1V-2.4A2 2 0 0 1 1.1-2.4V-1.1M-4-1.1h6.2v4.8H-4V-1.1Z"/>
      </g>
    </g>
    <text x="292" y="780" fill="#a7b4ab" font-size="12">Human approval gate</text>
  </g>
</svg>
