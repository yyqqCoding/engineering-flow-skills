    <path d="M144 165C170 210 196 244 214 268"/>
    <path d="M240 348V444"/>
    <g stroke-dasharray="7 6">
      <path d="M336 165C310 210 284 244 266 268"/>
      <path d="M282 481C346 452 350 358 292 322"/>
      <path d="M188 330C96 372 96 560 196 610"/>
    </g>
  </g>
