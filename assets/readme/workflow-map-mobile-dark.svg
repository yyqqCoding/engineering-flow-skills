      <path d="M8 15.2c6.5 0 8.5-8 15-8" stroke-dasharray="3 3" opacity="0.5"/>
      <path d="M8 16.8c6.5 0 8.5 8 15 8" stroke-dasharray="3 3" opacity="0.5"/>
      <path d="M8 16h15"/>
      <circle cx="4.5" cy="16" r="2.6" fill="#a78bfa"/>
      <circle cx="25.8" cy="16" r="3.2" fill="#a78bfa"/>
    </g>
    <text x="120" y="188" text-anchor="middle" fill="#edf5ef" font-size="15" font-weight="700">Code Design</text>
  </g>

  <g>
    <circle cx="360" cy="120" r="40" fill="#3b2517" stroke="#fb923c" stroke-width="2"/>
    <g transform="translate(341 101) scale(1.1875)" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 22h4.2l2.6-8.5 3.4 13 2.6-6H21"/>
      <circle cx="23" cy="10.5" r="5.5"/>
      <path d="m27 14.5 3 3.2"/>
    </g>
    <g transform="translate(388 92)">
      <circle r="12" fill="#fb923c" stroke="#0d120f" stroke-width="2.5"/>
      <g fill="none" stroke="#0d120f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-3.3-1.3V-2.8A2.3 2.3 0 0 1 1.3-2.8V-1.3M-4.6-1.3h7.2v5.6h-7.2V-1.3Z"/>
      </g>
    </g>
    <text x="360" y="188" text-anchor="middle" fill="#edf5ef" font-size="15" font-weight="700">Diagnose</text>
  </g>

  <g font-size="12" fill="#a7b4ab">
    <text x="118" y="228" text-anchor="middle">Design accepted</text>
    <text x="362" y="228" text-anchor="middle">Behavior undefined</text>
  </g>

