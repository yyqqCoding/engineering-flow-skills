<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Choose a workflow by your goal</title>
  <desc id="desc">Choose a workflow by the outcome you need. Develop aligns acceptance, waits for approval, then implements and verifies each behavior. Diagnose completes repairs when requested. Code Design returns a reusable proposal. Review is read-only until specific repairs are requested. Handoff preserves task state and existing authority. The workflows are independent entry points.</desc>
  <rect x="0.5" y="0.5" width="479" height="799" rx="10" fill="#fbfcfb" stroke="#dce2de"/>
  <text x="24" y="39" fill="#087b32" font-size="11" font-weight="700" letter-spacing="0.1em">CHOOSE BY YOUR GOAL</text>
  <text x="24" y="69" fill="#101512" font-size="19" font-weight="650">One task. The right entry.</text>
  <g id="workflow-develop">
  <rect x="24" y="96" width="432" height="112" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="62" cy="139" r="24" fill="#e9f7ee" stroke="#087b32" stroke-width="1.6"/>
  <g transform="translate(46 123)" fill="none" stroke="#087b32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16h6M23.5 16h6"/><circle cx="16" cy="16" r="7"/><path d="m12.8 16.2 2.2 2.2 4.2-4.8"/></g>
  <text x="104" y="121" fill="#087b32" font-size="10" font-weight="700" letter-spacing="0.055em">BUILD A CHANGE</text>
  <text x="104" y="145" fill="#101512" font-size="19" font-weight="700">Develop</text>
  <rect x="296" y="127" width="144" height="23" rx="11.5" fill="#e9f7ee"/>
  <text x="368" y="142.5" fill="#087b32" font-size="10.5" font-weight="600" text-anchor="middle">Approval checkpoint</text>
  <text x="104" y="171" fill="#58635d" font-size="13">Align examples; approve the change.</text>
  <text x="104" y="192" fill="#58635d" font-size="13">Build, verify and self-review each slice.</text>
  </g>
  <g id="workflow-diagnose">
  <rect x="24" y="220" width="432" height="112" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="62" cy="263" r="24" fill="#fff3e8" stroke="#df6c13" stroke-width="1.6"/>
  <g transform="translate(46 247)" fill="none" stroke="#df6c13" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 22h4.2l2.6-8.5 3.4 13 2.6-6H21"/><circle cx="23" cy="10.5" r="5.5"/><path d="m27 14.5 3 3.2"/></g>
  <text x="104" y="245" fill="#df6c13" font-size="10" font-weight="700" letter-spacing="0.055em">FIX BROKEN BEHAVIOR</text>
  <text x="104" y="269" fill="#101512" font-size="19" font-weight="700">Diagnose</text>
  <rect x="296" y="251" width="144" height="23" rx="11.5" fill="#fff3e8"/>
  <text x="368" y="266.5" fill="#df6c13" font-size="10.5" font-weight="600" text-anchor="middle">Fix when requested</text>
  <text x="104" y="295" fill="#58635d" font-size="13">Reproduce and locate the root cause.</text>
  <text x="104" y="316" fill="#58635d" font-size="13">A fix request covers repair and verification.</text>
  </g>
  <g id="workflow-code-design">
  <rect x="24" y="344" width="432" height="112" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="62" cy="387" r="24" fill="#f2edfc" stroke="#7142c7" stroke-width="1.6"/>
  <g transform="translate(46 371)" fill="none" stroke="#7142c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15.2c6.5 0 8.5-8 15-8M8 16.8c6.5 0 8.5 8 15 8" stroke-dasharray="3 3" opacity="0.5"/><path d="M8 16h15"/><circle cx="4.5" cy="16" r="2.6"/><circle cx="25.8" cy="16" r="3.2"/></g>
  <text x="104" y="369" fill="#7142c7" font-size="10" font-weight="700" letter-spacing="0.055em">SETTLE THE DESIGN</text>
  <text x="104" y="393" fill="#101512" font-size="19" font-weight="700">Code Design</text>
  <rect x="296" y="375" width="144" height="23" rx="11.5" fill="#f2edfc"/>
  <text x="368" y="390.5" fill="#7142c7" font-size="10.5" font-weight="600" text-anchor="middle">Proposal only</text>
  <text x="104" y="419" fill="#58635d" font-size="13">Create or refine a reusable proposal.</text>
  <text x="104" y="440" fill="#58635d" font-size="13">Settled decisions travel with the task.</text>
  </g>
  <g id="workflow-review">
  <rect x="24" y="468" width="432" height="112" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="62" cy="511" r="24" fill="#edf4ff" stroke="#2467ce" stroke-width="1.6"/>
  <g transform="translate(46 495)" fill="none" stroke="#2467ce" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.6h11l7 7v18H7zM18 3.6v7.4h7M11.5 17.5h9M11.5 22.5h6"/><path d="M11.5 13.5h9" stroke-width="2.8"/></g>
  <text x="104" y="493" fill="#2467ce" font-size="10" font-weight="700" letter-spacing="0.055em">ASSESS A CHANGE</text>
  <text x="104" y="517" fill="#101512" font-size="19" font-weight="700">Review</text>
  <rect x="296" y="499" width="144" height="23" rx="11.5" fill="#edf4ff"/>
  <text x="368" y="514.5" fill="#2467ce" font-size="10.5" font-weight="600" text-anchor="middle">Read-only by default</text>
  <text x="104" y="543" fill="#58635d" font-size="13">Assess the change and report findings.</text>
  <text x="104" y="564" fill="#58635d" font-size="13">Explicit repair requests continue here.</text>
  </g>
  <g id="workflow-handoff">
  <rect x="24" y="592" width="432" height="112" rx="10" fill="#FEFEFE" stroke="#dce2de"/>
  <circle cx="62" cy="635" r="24" fill="#f6f8f6" stroke="#58635d" stroke-width="1.6"/>
  <g transform="translate(46 619)" fill="none" stroke="#58635d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 16h14" stroke-dasharray="3 3"/><rect x="11" y="12.5" width="7" height="7" rx="2"/><circle cx="4.5" cy="16" r="3"/><circle cx="27.5" cy="16" r="3"/></g>
  <text x="104" y="617" fill="#58635d" font-size="10" font-weight="700" letter-spacing="0.055em">CONTINUE ELSEWHERE</text>
  <text x="104" y="641" fill="#101512" font-size="19" font-weight="700">Handoff</text>
  <rect x="296" y="623" width="144" height="23" rx="11.5" fill="#f6f8f6"/>
  <text x="368" y="638.5" fill="#58635d" font-size="10.5" font-weight="600" text-anchor="middle">No new authority</text>
  <text x="104" y="667" fill="#58635d" font-size="13">Capture progress, decisions and evidence.</text>
  <text x="104" y="688" fill="#58635d" font-size="13">Carry existing authority and pending approvals.</text>
  </g>
  <path d="M24 735H456" stroke="#dce2de"/>
  <text x="24" y="758" fill="#101512" font-size="13" font-weight="600">Develop includes design, debugging and review.</text>
  <text x="24" y="780" fill="#58635d" font-size="12">Same-task follow-ups keep context and existing authority.</text>
</svg>
