  <path d="m796 240 3.5 3.5 6-7" fill="none" stroke="#92f5d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="923" cy="240" r="17" fill="#493725" stroke="#ffc47f" stroke-width="2.5"/>
  <path d="M918 239v-4a5 5 0 0 1 10 0v4m-11 0h12v10h-12z" fill="none" stroke="#ffd19a" stroke-width="1.7" stroke-linejoin="round"/>
  <circle cx="1046" cy="240" r="13" fill="#182c43" stroke="#7ba3d6" stroke-width="2"/>
  <path d="M1041 240h10m-5-5v10" stroke="#b3d3ff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="1169" cy="240" r="13" fill="#182c43" stroke="#7ba3d6" stroke-width="2"/>
  <path d="m1164 240 3.5 3.5 6-7" stroke="#b3d3ff" fill="none" stroke-width="2" stroke-linecap="round"/>
 </g>
 <g class="sans" font-size="12" fill="#aec2d5" font-weight="610" text-anchor="middle">
  <text x="678" y="274">Discover</text>
  <text x="801" y="274">Clarify</text>
  <text x="923" y="280" fill="#ffc57e">Approval</text>
  <text x="1046" y="274">Implement</text>
  <text x="1169" y="274">Verify</text>
 </g>
 <rect x="651" y="312" width="540" height="127" rx="13" fill="#0b1526" stroke="#2a4358"/>
 <circle cx="675" cy="336" r="4" fill="#69f3d1"/>
 <text x="691" y="341" class="mono" font-size="14" fill="#b9d3ee">$engineering-flow:develop</text>
 <path d="M671 354H1172" stroke="#223449"/>
 <text x="672" y="380" class="mono" font-size="13" fill="#91a7c2">✓ discovery &amp; acceptance criteria aligned</text>
 <text x="672" y="407" class="mono" font-size="13" fill="#ffd090">● awaiting an explicit approval to code</text>
 <rect x="1127" y="393" width="2" height="16" fill="#ffd090" class="blink"/>
</g>
