<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Engineering Flow — Build with intent. Ship with evidence.</title>
<desc id="desc">Animated abstract coding terminal and approval gate. Four stages: Align, Approve, Build, Verify. Motion is decorative and never implies approval.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset="1" stop-color="#132344"/></linearGradient>
<linearGradient id="text" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7bf1cf"/><stop offset="1" stop-color="#77b8ff"/></linearGradient>
<radialGradient id="a"><stop stop-color="#315dc6" stop-opacity=".34"/><stop offset="1" stop-color="#315dc6" stop-opacity="0"/></radialGradient>
<pattern id="dot" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.3" fill="#a0c9f6" opacity=".1"/></pattern>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#02040b" flood-opacity=".42"/></filter>
</defs>
<style>
.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
.path{stroke-dasharray:9 13;animation:move 4s linear infinite}
.glow{animation:breathe 3s ease-in-out infinite}
.light{animation:light 3s ease-in-out infinite}
@keyframes move{to{stroke-dashoffset:-132}}
@keyframes breathe{0%,100%{opacity:.24}50%{opacity:.72}}
@keyframes light{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.path,.glow,.light{animation:none!important}}
</style>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect width="1200" height="430" rx="22" fill="url(#dot)"/>
<circle cx="924" cy="191" r="330" fill="url(#a)" class="glow"/>
<rect x="55" y="52" width="214" height="40" rx="20" fill="#163832" stroke="#326c63"/>
<circle cx="76" cy="72" r="6" fill="#81f5d7" class="light"/>
<text x="94" y="79" class="sans" fill="#cdf3e5" font-size="17" font-weight="750" letter-spacing="1.8">CODING AGENT</text>
<text x="53" y="174" class="sans" fill="#f1f6ff" font-size="66" font-weight="800" letter-spacing="-2">ENGINEERING</text>
<text x="53" y="258" class="sans" fill="url(#text)" font-size="94" font-weight="800" letter-spacing="-3">FLOW.</text>
<text x="58" y="323" class="sans" fill="#ccdbec" font-size="24" font-weight="600">Build with intent.</text>
<text x="58" y="358" class="sans" fill="#ccdbec" font-size="24" font-weight="600">Ship with evidence.</text>
<g filter="url(#shadow)">
<rect x="678" y="63" width="464" height="313" rx="20" fill="#0c1b2d" stroke="#3c5974" stroke-width="2"/>
<rect x="678" y="63" width="464" height="63" rx="20" fill="#192e45"/>
<path d="M678 109H1142" stroke="#415a73"/>
<circle cx="706" cy="95" r="7" fill="#fb8a90"/><circle cx="732" cy="95" r="7" fill="#f8c979"/><circle cx="758" cy="95" r="7" fill="#78dcb8"/>
<text x="791" y="102" class="sans" fill="#dae9fa" font-size="20" font-weight="700">Develop</text>
<text x="708" y="168" class="sans" fill="#93f0d8" font-size="20" font-weight="700">ALIGN</text>
<text x="938" y="168" class="sans" fill="#eec78e" font-size="20" font-weight="700">APPROVE</text>
<path d="M712 216H1107" stroke="#445d74" stroke-width="6" stroke-linecap="round"/>
<path d="M712 216H1107" stroke="#82dfd1" stroke-width="4" class="path"/>
<circle cx="723" cy="216" r="15" fill="#163a39" stroke="#83f2d1" stroke-width="3"/>
<path d="m716 216 5 5 9-11" fill="none" stroke="#9df4db" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="843" cy="216" r="15" fill="#173a39" stroke="#83f2d1" stroke-width="3"/>
<path d="m836 216 5 5 9-11" fill="none" stroke="#9df4db" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="971" cy="216" r="24" fill="#584028" stroke="#ffd48c" stroke-width="3"/>
<circle cx="971" cy="216" r="34" fill="none" stroke="#efbd74" stroke-width="3" class="glow"/>
<path d="M963 214v-6a8 8 0 0 1 16 0v6m-17 0h18v16h-18z" fill="none" stroke="#ffe2ae" stroke-width="2.5"/>
<circle cx="1100" cy="216" r="15" fill="#192f4f" stroke="#8abafa" stroke-width="3"/>
<path d="m1094 216 5 5 9-11" fill="none" stroke="#b6d8ff" stroke-width="2.5" stroke-linecap="round"/>
<text x="726" y="287" class="sans" fill="#c2d5e9" font-size="22" font-weight="750">BUILD</text>
<path d="M815 280H909" stroke="#48687b" stroke-width="3" stroke-linecap="round"/>
<text x="934" y="287" class="sans" fill="#c2d5e9" font-size="22" font-weight="750">VERIFY</text>
<rect x="703" y="317" width="412" height="35" rx="17.5" fill="#183d35"/>
<text x="909" y="341" class="sans" text-anchor="middle" fill="#aaf4d9" font-size="17" font-weight="750">HUMAN APPROVAL REQUIRED</text>
</g>
</svg>