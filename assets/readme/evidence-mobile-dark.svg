    <text x="32" y="90" fill="#F3F5F7" font-size="30" font-weight="720">45/51</text>
    <text x="150" y="90" fill="#69747E" font-size="19">→</text>
    <text x="190" y="90" fill="#71D8B2" font-size="30" font-weight="720">51/51</text>
    <rect x="32" y="116" width="384" height="10" rx="4" fill="#293038"/>
    <rect x="32" y="116" width="339" height="10" rx="4" fill="#69747E"/>
    <rect x="32" y="142" width="384" height="10" rx="4" fill="#293038"/>
    <rect x="32" y="142" width="384" height="10" rx="4" fill="#39C792"/>
    <text x="32" y="184" fill="#89949E" font-size="13">17 isolated development scenarios</text>

    <text x="32" y="253" fill="#89949E" font-size="12" font-weight="700">TASK CONTINUITY</text>
    <text x="32" y="298" fill="#F3F5F7" font-size="30" font-weight="720">0/12</text>
