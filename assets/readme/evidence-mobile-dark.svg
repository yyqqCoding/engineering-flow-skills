  <rect x="32" y="182" width="416" height="11" rx="5.5" fill="#43c66d"/>
  <text x="32" y="216" fill="#a7b4ab" font-size="12">17 engineering scenarios &#183; 3 runs each</text>

  <text x="32" y="276" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="0.1em">MULTI-TURN CONTINUITY</text>
  <text x="32" y="320" fill="#a7b4ab" font-size="28" font-weight="720">0/12</text>
  <text x="112" y="319" fill="#405045" font-size="19">&#8594;</text>
  <text x="146" y="320" fill="#60a5fa" font-size="28" font-weight="720">12/12</text>
  <text x="32" y="352" fill="#a7b4ab" font-size="10" font-weight="650">WITHOUT WORKFLOWS</text>
