    <rect x="32" y="324" width="384" height="10" rx="4" fill="#293038"/>
    <rect x="32" y="350" width="384" height="10" rx="4" fill="#5EA2F7"/>
    <text x="32" y="392" fill="#89949E" font-size="13">4 multi-turn workflows · 3 runs each</text>

    <text x="32" y="449" fill="#89949E" font-size="12" font-weight="700">DETERMINISTIC GATES</text>
