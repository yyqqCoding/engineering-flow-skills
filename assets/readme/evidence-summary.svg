<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Historical Engineering Flow evaluation highlights</title><desc id="desc">Historical separate early cohorts: everyday engineering 45/51 to 51/51, multi-turn continuity 0/12 to 12/12, and exact explicit routing 51/51. Not current v1.0.4 results.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fafc"/><stop offset="1" stop-color="#edf4fb"/></linearGradient></defs>
<style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif}.line{stroke-dasharray:4 10;animation:flow 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-126}}@media(prefers-reduced-motion:reduce){.line{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="249" rx="20" fill="url(#bg)" stroke="#cbdde7"/>
