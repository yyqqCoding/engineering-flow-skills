<text x="253" y="143" class="t" fill="#0d8a70" font-size="42" font-weight="800">51/51</text>
<text x="435" y="65" class="t" fill="#3766a1" font-size="22" font-weight="760">CONTINUITY</text>
<text x="435" y="143" class="t" fill="#5a7182" font-size="42" font-weight="780">0/12</text>
<path d="M577 122H622" stroke="#7a9dbb" stroke-width="5" class="line"/><path d="m614 114 12 8-12 8" stroke="#7a9dbb" fill="none" stroke-width="4" stroke-linecap="round"/>
<text x="634" y="143" class="t" fill="#2c71c6" font-size="42" font-weight="800">12/12</text>
<text x="835" y="65" class="t" fill="#5e569e" font-size="22" font-weight="760">EXPLICIT ROUTING</text>
