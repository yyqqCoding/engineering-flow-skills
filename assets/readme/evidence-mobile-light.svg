<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Engineering Flow validation results</title>
  <desc id="desc">Matched-pair runs under one identical configuration. Everyday engineering behavior improved from 45 of 51 to 51 of 51. Multi-turn task continuity improved from 0 of 12 to 12 of 12. Deterministic project tests passed 50 of 50, and explicit workflow routing was exact at 51 of 51.</desc>

