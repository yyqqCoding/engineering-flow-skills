  <text x="32" y="320" fill="#58635d" font-size="28" font-weight="720">0/12</text>
  <text x="112" y="319" fill="#bdc8c0" font-size="19">&#8594;</text>
  <text x="146" y="320" fill="#2467ce" font-size="28" font-weight="720">12/12</text>
  <text x="32" y="352" fill="#58635d" font-size="10" font-weight="650">WITHOUT WORKFLOWS</text>
