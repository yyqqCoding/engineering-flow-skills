<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Flow validation results</title>
  <desc id="desc">General behavior improved from 45 of 51 to 51 of 51. Task continuity improved from 0 of 12 to 12 of 12. Deterministic tests passed 49 of 49 and explicit routing passed 51 of 51.</desc>
  <rect width="1200" height="300" rx="8" fill="#0B0E11"/>
  <path d="M400 42V258M800 42V258" stroke="#293038"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="0">
