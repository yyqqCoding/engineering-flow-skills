<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Engineering Flow validation results</title>
  <desc id="desc">Matched-pair runs under one identical configuration. Everyday engineering behavior improved from 45 of 51 to 51 of 51. Multi-turn task continuity improved from 0 of 12 to 12 of 12. Deterministic project tests passed 50 of 50, and explicit workflow routing was exact at 51 of 51.</desc>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="#0d120f" stroke="#2b372f"/>
  <path d="M400 40V260M800 40V260" stroke="#2b372f"/>

  <text x="48" y="56" fill="#43c66d" font-size="12" font-weight="700" letter-spacing="0.1em">EVERYDAY BEHAVIOR</text>
  <text x="48" y="104" fill="#a7b4ab" font-size="30" font-weight="720">45/51</text>
  <text x="152" y="103" fill="#405045" font-size="20">&#8594;</text>
  <text x="188" y="104" fill="#43c66d" font-size="30" font-weight="720">51/51</text>
  <text x="48" y="140" fill="#a7b4ab" font-size="11" font-weight="650">WITHOUT WORKFLOWS</text>
  <rect x="48" y="148" width="288" height="11" rx="5.5" fill="#2b372f"/>
  <rect x="48" y="148" width="254" height="11" rx="5.5" fill="#405045"/>
  <text x="48" y="182" fill="#43c66d" font-size="11" font-weight="650">WITH WORKFLOWS</text>
  <rect x="48" y="190" width="288" height="11" rx="5.5" fill="#2b372f"/>
  <rect x="48" y="190" width="288" height="11" rx="5.5" fill="#43c66d"/>
  <text x="48" y="234" fill="#a7b4ab" font-size="13">17 engineering scenarios &#183; 3 runs each</text>

  <text x="448" y="56" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="0.1em">MULTI-TURN CONTINUITY</text>
  <text x="448" y="104" fill="#a7b4ab" font-size="30" font-weight="720">0/12</text>
  <text x="536" y="103" fill="#405045" font-size="20">&#8594;</text>
  <text x="572" y="104" fill="#60a5fa" font-size="30" font-weight="720">12/12</text>
  <text x="448" y="140" fill="#a7b4ab" font-size="11" font-weight="650">WITHOUT WORKFLOWS</text>
  <rect x="448" y="148" width="288" height="11" rx="5.5" fill="#2b372f"/>
  <text x="448" y="182" fill="#60a5fa" font-size="11" font-weight="650">WITH WORKFLOWS</text>
  <rect x="448" y="190" width="288" height="11" rx="5.5" fill="#2b372f"/>
  <rect x="448" y="190" width="288" height="11" rx="5.5" fill="#60a5fa"/>
  <text x="448" y="234" fill="#a7b4ab" font-size="13">4 multi-turn tasks &#183; 3 runs each</text>

  <text x="848" y="56" fill="#a7b4ab" font-size="12" font-weight="700" letter-spacing="0.1em">DETERMINISTIC GATES</text>
  <circle cx="866" cy="102" r="18" fill="#173b24"/>
  <path d="M857 102l6 6 12-13" fill="none" stroke="#43c66d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="898" y="111" fill="#edf5ef" font-size="27" font-weight="720">50/50</text>
  <text x="848" y="146" fill="#a7b4ab" font-size="13">Static, hook, fixture, and scorer tests</text>
  <circle cx="866" cy="188" r="18" fill="#182d4b"/>
  <path d="M857 188l6 6 12-13" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="898" y="197" fill="#edf5ef" font-size="27" font-weight="720">51/51</text>
  <text x="848" y="232" fill="#a7b4ab" font-size="13">Named workflow loaded, 0 loaded unasked</text>

  <text x="48" y="278" fill="#a7b4ab" font-size="12">Both sides ran the same tasks under one identical configuration. Scoring is external: file changes and test output, never a self-report.</text>
