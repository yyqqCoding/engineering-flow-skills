<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Flow</title>
  <desc id="desc">A mobile workflow view from repository discovery through verified delivery.</desc>
  <rect width="480" height="720" rx="8" fill="#F6F8FA"/>
  <path d="M0 1H480" stroke="#D8DEE4"/>
  <path d="M32 74H448" stroke="#DDE3E8"/>
  <path d="M32 672H448" stroke="#DDE3E8"/>

  <rect x="32" y="26" width="24" height="24" rx="4" fill="#15191E"/>
  <path d="M38 33H50V37H42V40H49V44H42V48H38V33Z" fill="#F6F8FA"/>
  <text x="70" y="44" fill="#15191E" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="0">ENGINEERING FLOW</text>

  <text x="32" y="124" fill="#12161B" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="720" letter-spacing="0">ALIGN. AUTHORIZE.</text>
  <text x="32" y="162" fill="#12161B" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="720" letter-spacing="0">BUILD. VERIFY.</text>
  <text x="32" y="202" fill="#5C6873" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" letter-spacing="0">Task-level coding agent workflows.</text>
  <text x="32" y="224" fill="#5C6873" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" letter-spacing="0">Grounded in facts. Finished with evidence.</text>

  <path d="M58 294V614" stroke="#C8D0D7" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="0">
    <circle cx="58" cy="294" r="22" fill="#F6F8FA" stroke="#377FC8" stroke-width="2"/>
    <text x="58" y="299" text-anchor="middle" fill="#286FAF" font-size="12" font-weight="700">01</text>
    <text x="98" y="290" fill="#27313A" font-size="14" font-weight="650">DISCOVER</text>
    <text x="98" y="310" fill="#77828C" font-size="12">Locate repository truth</text>

    <circle cx="58" cy="374" r="22" fill="#F6F8FA" stroke="#209B70" stroke-width="2"/>
    <text x="58" y="379" text-anchor="middle" fill="#15855E" font-size="12" font-weight="700">02</text>
    <text x="98" y="370" fill="#27313A" font-size="14" font-weight="650">CLARIFY</text>
    <text x="98" y="390" fill="#77828C" font-size="12">Resolve material decisions</text>

    <circle cx="58" cy="454" r="22" fill="#F6F8FA" stroke="#B88617" stroke-width="2"/>
    <text x="58" y="459" text-anchor="middle" fill="#9A7110" font-size="12" font-weight="700">03</text>
    <text x="98" y="450" fill="#27313A" font-size="14" font-weight="650">APPROVE</text>
    <text x="98" y="470" fill="#77828C" font-size="12">Pause at an explicit checkpoint</text>

    <circle cx="58" cy="534" r="22" fill="#F6F8FA" stroke="#C75B4A" stroke-width="2"/>
    <text x="58" y="539" text-anchor="middle" fill="#B44B3B" font-size="12" font-weight="700">04</text>
    <text x="98" y="530" fill="#27313A" font-size="14" font-weight="650">IMPLEMENT</text>
    <text x="98" y="550" fill="#77828C" font-size="12">Make the minimum clear change</text>

    <circle cx="58" cy="614" r="22" fill="#F6F8FA" stroke="#795DBD" stroke-width="2"/>
    <text x="58" y="619" text-anchor="middle" fill="#684EAA" font-size="12" font-weight="700">05</text>
    <text x="98" y="610" fill="#27313A" font-size="14" font-weight="650">VERIFY</text>
    <text x="98" y="630" fill="#77828C" font-size="12">Finish with fresh evidence</text>
  </g>

  <circle cx="38" cy="696" r="3" fill="#209B70"/>
  <text x="50" y="700" fill="#5C6873" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600" letter-spacing="0">TASK-LEVEL CONTINUITY</text>
</svg>
